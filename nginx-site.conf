upstream nezha_dashboard {
    server 127.0.0.1:8008;
    keepalive 64;
}

upstream nezha_grpc {
    server 127.0.0.1:8009;
    keepalive 64;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name rmm.houdini.fastmoneyclaim.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rmm.houdini.fastmoneyclaim.com;

    ssl_certificate     /etc/letsencrypt/live/rmm.houdini.fastmoneyclaim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmm.houdini.fastmoneyclaim.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2g;
    underscores_in_headers on;
    # Cloudflare: trust CF-Connecting-IP for real client address
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    # Canonical sign-in URL
    location = /login {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Houdini-Internal "houdini-internal-builder";
        proxy_pass http://127.0.0.1:8091;
        add_header Cache-Control "no-store" always;
    }
    location = /login/ { return 301 /login; }
    location = /dashboard/login { return 302 /login; }
    location = /dashboard/login/ { return 302 /login; }

    location = / {
        return 302 /login;
    }
    location ^~ /server {
        return 302 /login;
    }
    location ^~ /service {
        return 302 /login;
    }
    location ^~ /assets/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_pass http://127.0.0.1:8008;
    }

    location = /dashboard {
        return 301 /dashboard/;
    }
    location = /dashboard/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Houdini-Internal "houdini-internal-builder";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:8091;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location ^~ /dashboard/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Houdini-Internal "houdini-internal-builder";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://127.0.0.1:8091;
    }

    location ^~ /dashboard/agent-builder {
        rewrite ^/dashboard/agent-builder/?(.*)$ /dashboard/$1 permanent;
    }

    # Agent gRPC — real IP for inventory GeoIP / WAF
    location ^~ /proto.NezhaService/ {
        grpc_set_header Host $host;
        grpc_set_header CF-Connecting-IP $http_cf_connecting_ip;
        grpc_set_header nz-realip $http_cf_connecting_ip;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        grpc_socket_keepalive on;
        client_body_timeout 600s;
        send_timeout 600s;
        client_max_body_size 10m;
        grpc_buffer_size 4m;
        grpc_pass grpc://nezha_dashboard;
    }

    # MCP (Nezha PAT automation) — same origin as dashboard
    location = /mcp {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:8008;
    }

    location ~* ^/api/v1/ws/(server|terminal|file)(.*)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header nz-realip $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Origin https://$host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8008;
    }


    # Nezha terminal SPA + no-cache (avoid CF/proxy caching 404s)
    location ^~ /dashboard/terminal {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8008;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header nz-realip $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:8008;
    }
}
